[general]
import = [
  # "./themes/tokyonight/storm.toml",
   "./themes/tokyonight/storm.toml",
  # "./themes/kanagawa_wave.toml.toml",
  # "./themes/nightfox/nordfox.toml",
]

[font.bold]
family = "AporeticSerifMono Nerd Font"
style = "Bold"

[font.bold_italic]
family =  "AporeticSerifMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "AporeticSerifMono Nerd Font"
style = "Italic"

[font.normal]
family = "AporeticSerifMono Nerd Font"
style = "Regular"

[window]
# opacity = 0.9

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[[keyboard.bindings]]
key = "V"
mods = "Alt"
action = "Paste"
